{{- include "boosty-tv.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "boosty-tv.name" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "boosty-tv.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "boosty-tv.name" . }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: {{ include "boosty-tv.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: PUBLIC_URL
              value: {{ .Values.config.publicUrl | quote }}
            - name: BASE_PATH
              value: {{ .Values.config.basePath | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: DATA_DIR
              value: /data
            - name: STATIC_DIR
              value: /app/dist
            - name: VAULT_KEY_FILE
              value: /run/secrets/boosty/vault.key
            - name: NODE_ENV
              value: production
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          readinessProbe:
            httpGet:
              path: {{ printf "%s/health" .Values.config.basePath | quote }}
              port: http
          livenessProbe:
            httpGet:
              path: {{ printf "%s/health" .Values.config.basePath | quote }}
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: key
              mountPath: /run/secrets/boosty
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (include "boosty-tv.name" .) .Values.persistence.existingClaim | quote }}
        - name: key
          secret:
            secretName: {{ .Values.secrets.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.secrets.key | quote }}
                path: vault.key
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
