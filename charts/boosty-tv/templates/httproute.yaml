{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "boosty-tv.name" . }}
spec:
  parentRefs:
    {{- toYaml .Values.route.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ default "/" .Values.config.basePath | quote }}
      backendRefs:
        - name: {{ include "boosty-tv.name" . }}
          port: {{ .Values.service.port }}
{{- end }}
